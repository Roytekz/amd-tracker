name: AMD Giveaway Tracker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright and Linux Browser Dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run Tracker Script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python tracker.py

      - name: Save Seen Promotions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add amd_seen.json || true
          git diff --staged --quiet || (git commit -m "Update seen promotions" && git pull --rebase && git push)
