name: AMD Drop Tracker

on:
  schedule:
    # 1. Base routine: Runs every 15 minutes across the day
    - cron: '*/15 * * * *'
    
    # 2. DROP WINDOW LAUNCH: Triggers at 3:54 PM UTC (9:24 PM IST)
    # This single trigger will run continuously until 9:35 PM IST
    - cron: '54 15 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-drops:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Tracker Script
        run: |
          python tracker.py

      - name: Commit and Push New Seen URLs (Memory)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f seen_urls.json ]; then
            git add seen_urls.json
            git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen URLs [skip ci]" && git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main)
          fi
