name: AMD Drop Tracker

on:
  schedule:
    # 1. Runs every 30 minutes during the rest of the day to save limits
    - cron: '*/30 * * * *'
    
    # 2. ULTRA-FAST WINDOW: Runs every 1 minute from 3:55 PM to 4:05 PM UTC 
    # (Safely covers 9:25 PM to 9:35 PM IST for early and on-time drops)
    - cron: '55-59 15 * * *'
    - cron: '0-5 16 * * *'

  # Allows you to manually trigger it from the Actions tab anytime
  workflow_dispatch:

jobs:
  check-drops:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Tracker Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python tracker.py

      - name: Commit and Push New Seen URLs (Memory)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f seen_urls.json ]; then
            git add seen_urls.json
            git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen sitemap URLs [skip ci]" && git push)
          fi
